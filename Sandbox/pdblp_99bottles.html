        <button onclick="init()">Update</button>
        <button onclick="do_run()">Run</button>
        <button onclick="do_step()">Step</button>
        <input type="text" id="stepsize" size="6" value="1">

        <div id="output"></div><br>
<style>
td {vertical-align:top} th {text-align:left} #output div {margin-left:1em;font-family:monospace} #output {color:#EAEAEA;background:#111111;font-family:monospace;padding:0em 0.2em;white-space:pre-wrap;text-align:left;max-width:70em;min-height:2em}
td {vertical-align:top} th {text-align:left} #workspace div {margin-left:1em;font-family:monospace} #workspace {color:white;background:#111111;font-family:monospace;padding:0.3em 0.2em;text-align:left;max-width:70em;white-space:pre-wrap}
#workspace b {color:#FF77AA} #workspace i {color:#77DDFF;font-style:normal}
</style>
<script>
var code = "", ahead = [], tape = [0], dp = 0, ip = 0, quit = 0, steps = 0;
var buf = [], running = 0;

function init() {
  code = document.getElementById("code").value;
  ahead = []; var st = [], err = -1;
  for (var i = 0; i < code.length; i++) {
    if (code[i] == "(") st.push(i);
    else if (code[i] == ")") {
      if (!st.length) { err = i; break; }
      var b = st.pop(); ahead[i] = b; ahead[b] = i;
    }
  }
  if (err < 0 && st.length) err = st[0];
  tape = [0]; dp = 0; ip = 0; quit = 0; steps = 0; buf = []; running = 0;
  document.getElementById("output").textContent = "";
  show();
  if (err >= 0) alert("unmatched '" + code[err] + "' at " + err);
}

function done() { return quit || ip >= code.length; }

function step() {
  var c = code.charAt(ip);
  if (c == "R") { if (--dp < 0) quit++; }
  else if (c == "\u03bb") {
    if (++tape[dp] >= 255) tape[dp] = 0;
    if (++dp >= tape.length) tape[dp] = 0;
  }
  else if (c == "(") { if (!tape[dp]) ip = ahead[ip]; }
  else if (c == ")") { if (tape[dp]) ip = ahead[ip]; }
  else if (c == "\u00f4") { buf.push(String.fromCharCode(tape[dp])); }
  steps++; ip++;
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function show() {
  var w = document.getElementById("workspace");
  if (!code) { w.innerHTML = "&nbsp;"; return; }
  var a = Math.max(0, ip - 32), b = Math.min(code.length, ip + 33);
  var win = esc(code.substring(a, ip).replace(/\n/g, " "))
          + "<b>" + esc(code.charAt(ip) || "\u25a1") + "</b>"
          + esc(code.substring(ip + 1, b).replace(/\n/g, " "));
  var cells = "";
  for (var i = 0; i < Math.max(tape.length, 14); i++) {
    var v = tape[i] === undefined ? 0 : tape[i];
    var s = ("   " + v).slice(-3);
    cells += (i == dp ? "<b>[" + s + "]</b>" : " " + s + " ");
  }
  w.innerHTML = "ip <i>" + ip + "</i>/" + code.length
    + "   dp <i>" + dp + "</i>   steps <i>" + steps + "</i>"
    + (done() ? "   <i>halted</i>" : "") + "\n"
    + "..." + win + "...\n" + cells;
  flush();
}

function flush() {
  if (buf.length) {
    document.getElementById("output").textContent += buf.join("");
    buf = [];
  }
}

function do_step() {
  if (!code) init();
  if (done()) return;
  var n = parseInt(document.getElementById("stepsize").value) || 1;
  while (n-- > 0 && !done()) step();
  show();
}

function do_run() {
  if (!code) init();
  if (running) { running = 0; return; }
  running = 1;
  chunk();
}

function chunk() {
  if (!running) { show(); return; }
  var n = 400000;
  while (n-- > 0 && !done()) step();
  flush();
  if (done()) { running = 0; show(); return; }
  show();
  setTimeout(chunk, 0);
}

init();
</script>
